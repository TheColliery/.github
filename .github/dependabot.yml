version: 2
updates:
  - package-ecosystem: github-actions
    # This repository's copy differs from the organization's: it holds the canon's templates (no room does), so it lists their workflow folders too.
    # A non-root directory is scanned for the YAML files directly in it (Dependabot's github-actions file fetcher), hence /.github/workflows under each template.
    directories:
      - /
      - /templates/article/.github/workflows
      - /templates/overlay-coal-skill/.github/workflows
      - /templates/overlay-llm-deploy/.github/workflows
      - /templates/private-working/.github/workflows
      - /templates/published-code/.github/workflows
    schedule:
      interval: weekly
      # One fixed weekly slot, the same in every repository of the organization.
      day: thursday
      time: "11:30"
      timezone: Asia/Bangkok
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    # Assign every bump PR to the maintainer -> a notification fires (assignment is
    # a "participating" event, delivered at any watch level).
    assignees:
      - HetCreep
    # Who merges what: a PR holding only patch and minor bumps merges itself once the required checks pass (dependabot-auto-merge.yml); a PR holding a major bump waits for a human.
    # One group with no group-by: Dependabot opens ONE pull request a week for every action in every folder above (dependabot-core, create_group_update_pull_request.rb and
    # group_update_creation.rb, compile_all_dependency_changes_for_directories: each directory's changes are merged into one change; only group-by: dependency-name splits it, one PR per
    # dependency name). That keeps one commit per action across the canon and this repo's own workflows, which scripts/template-workflows.test.mjs checks, and the three
    # github/codeql-action paths (init, analyze, upload-sarif: three dependency names to the bot) move together. One PR also means no second PR open beside it: two PRs on one workflow
    # file raced, the first merged, and GitHub refused auto-merge on whichever landed second (commit 3541faf, 2026-10-23: CoalBoard #29, Kolwen #66, .github #89, merged by hand).
    # Every file in these folders must parse as YAML: Dependabot fails the whole job on one that does not (scripts/template-workflows.test.mjs checks the files it is pointed at).
    # Not re-measured on this repository since this change. The one cost: a PR holding a major bump reads as major, so the whole week's bumps wait for a human.
    groups:
      github-actions:
        patterns:
          - "*"
