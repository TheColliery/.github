version: 2
updates:
  - package-ecosystem: github-actions
    # This repository's copy differs from the organization's: it holds the canon's templates (no room does), so it lists their workflow folders too and groups by dependency name.
    # A non-root directory is scanned for the YAML files directly in it (Dependabot's github-actions file fetcher), hence /.github/workflows under each template.
    directories:
      - /
      - /templates/article/.github/workflows
      - /templates/overlay-coal-skill/.github/workflows
      - /templates/overlay-llm-deploy/.github/workflows
      - /templates/private-working/.github/workflows
      - /templates/published-code/.github/workflows
    schedule:
      interval: weekly
      # One fixed weekly slot, the same in every repository of the organization.
      day: thursday
      time: "11:30"
      timezone: Asia/Bangkok
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    # Assign every bump PR to the maintainer -> a notification fires (assignment is
    # a "participating" event, delivered at any watch level). Human still merges.
    assignees:
      - HetCreep
    # One group, and version-update PRs one at a time. group-by: dependency-name makes one PR for each action across all the directories above (docs: groups.<name>.group-by), so a PR moves
    # its action in every folder at once and the pin test (one commit per action across the canon and this repo's own workflows) stays green on it. open-pull-requests-limit: 1
    # keeps the other bumps waiting: the queue drains one action a week, and no second PR is ever open to fall behind the first (two PRs on one workflow file race: the first merges,
    # the second is then behind main and GitHub refuses its auto-merge, because GITHUB_TOKEN may not write workflow content outside its own diff). Security updates have their own fixed
    # limit of 10 (docs: open-pull-requests-limit) and are not held by this one. The one known cost: a PR holding a major bump reads as major and waits for a human (the auto-merge
    # allowlist), and while it waits no other version bump opens, the same shape as the single group before. The codeql-action paths are one dependency, so init, analyze and
    # upload-sarif move together (a split bump reds CodeQL).
    open-pull-requests-limit: 1
    groups:
      github-actions:
        group-by: dependency-name
        patterns:
          - "*"
