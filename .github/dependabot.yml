version: 2
updates:
  - package-ecosystem: github-actions
    # This repository's copy differs from the organization's: it holds the canon's templates (no room does), so it lists their workflow folders too and groups by dependency name.
    # A non-root directory is scanned for the YAML files directly in it (Dependabot's github-actions file fetcher), hence /.github/workflows under each template.
    directories:
      - /
      - /templates/article/.github/workflows
      - /templates/overlay-coal-skill/.github/workflows
      - /templates/overlay-llm-deploy/.github/workflows
      - /templates/private-working/.github/workflows
      - /templates/published-code/.github/workflows
    schedule:
      interval: weekly
      # One fixed weekly slot, the same in every repository of the organization.
      day: thursday
      time: "11:30"
      timezone: Asia/Bangkok
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    # Assign every bump PR to the maintainer -> a notification fires (assignment is
    # a "participating" event, delivered at any watch level). Human still merges.
    assignees:
      - HetCreep
    # ONE group for every action bump, whatever its size: no second group, so no split between groups. Two PRs that touch the same
    # workflow file race: the first merges, the second is then behind main and GitHub
    # refuses its auto-merge (GITHUB_TOKEN may not write workflow content outside its own
    # diff). group-by: dependency-name makes ONE PR PER ACTION across all the directories above (docs: groups.<name>.group-by),
    # each moving that action in every folder at once, which the repository's pin test (one commit per action across the canon and
    # the repo's own workflows) needs; two actions bumped in one week are two PRs that can touch the same file, the race above,
    # which the weekly slot's first live run will show. A PR holding a major bump reads as major and waits for a human (the auto-merge allowlist); the codeql-action
    # paths are one dependency, so init, analyze and upload-sarif move together (a split bump reds CodeQL).
    groups:
      github-actions:
        group-by: dependency-name
        patterns:
          - "*"
