name: announce-release

# The Discussions release-announcement PILOT (UMB-344). It mirrors a Release that is ALREADY published into the organisation's Announcements discussions (the org page's source
# repository is this one), using the workflow's own token with discussions: write and no other credential. Why this shape, and why
# the Releases API's discussion_category_name cannot do it (it opens the discussion in the Release's own repository):
# scripts/lib/announce-release.mjs.
#
# Two ways to run it. On the SIX-HOURLY SCHEDULE (opened by the owner on 2026-10-04, after the first post was read) it sweeps the
# stable Releases published in the last 30 hours and posts each one once. The window is sized in scripts/lib/announce-release.mjs
# (SCHEDULE_WINDOW_HOURS; its arithmetic is there): two dropped slots plus the largest scheduled-run delay measured so far
# (MEASURED_MAX_DELAY_HOURS, 5 h 36 min on the second run) plus a period of headroom. The marker only prevents a DOUBLE post; it
# cannot rescue a Release the window never reached. A hidden marker in the body is the key, so a Release already announced is found
# and never posted twice, and a run that finds nothing new posts nothing and says so. A pre-release (a launch-form Release) is
# left to a manual run. A Release whose mirrored title would overflow GitHub's 200-character title ceiling is HELD, never cut and
# never posted bare: the run names it in its summary and fails, and a manual run with repo, tag, post and title posts it once the
# room has re-composed a title (a manual run is not limited by the window). By hand (workflow_dispatch) a run with post left false
# only prints what it would open; post: true opens one discussion per Release, once, and reads it back. The schedule runs on the
# default branch only.
on:
  schedule:
    # 07:37 Bangkok, 13:37, 19:37, 01:37: a fixed minute off the hour, clear of the 06:45 to 07:20 router window.
    - cron: '37 */6 * * *'
  workflow_dispatch:
    inputs:
      repo:
        description: 'A TheColliery repository name. Leave empty to sweep every Release published in the last window_hours.'
        required: false
        type: string
        default: ''
      tag:
        description: 'The vX.Y.Z tag of a published Release (needed with repo).'
        required: false
        type: string
        default: ''
      post:
        description: 'Post the discussion. False (the default) only prints what would be posted.'
        required: false
        type: boolean
        default: false
      title:
        description: 'A manual post only (needs repo and tag): the re-composed title (from the room) for a Release held because its mirrored title overflows 200 characters.'
        required: false
        type: string
        default: ''
      window_hours:
        description: 'Sweep only: how far back a Release counts as new (1 to 744).'
        required: false
        type: string
        default: '48'

# Nothing at the workflow level; the one job declares its own scopes (SKILL-REPO-PATTERN.md, Layer 5).
permissions: {}

# cancel-in-progress: FALSE -- the job opens a public discussion, a publish; a run killed after the create but before the read-back
# would leave a post nobody verified, so a second run waits for the first (SKILL-REPO-PATTERN.md's concurrency bullet).
concurrency:
  group: announce-release
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # testing.md: every run has a finite clock; a room re-sizes this from its own measured suite time
    permissions:
      contents: read
      discussions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job pushes nothing, so the workflow token has no business staying in .git/config for the
          # rest of the job, readable by every later step (SKILL-REPO-PATTERN.md, Layer 5).
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Announce the Release (a dry run unless post is true)
        env:
          # Inputs reach the script through env, never interpolated into the run: line (GitHub's hardening guide: script injection).
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_TITLE: ${{ inputs.title }}
          # A scheduled run posts (the schedule IS the switch); a manual run follows its post input, a dry run by default.
          INPUT_POST: ${{ github.event_name == 'schedule' && 'true' || inputs.post }}
          INPUT_WINDOW_HOURS: ${{ github.event_name == 'schedule' && '30' || inputs.window_hours }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/announce-release.mjs
