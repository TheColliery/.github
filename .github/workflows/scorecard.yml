name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '0 6 * * 2'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'

permissions:
  contents: read

# cancel-in-progress: FALSE, deliberately. Unlike the read-only workflows here, Scorecard
# UPLOADS a SARIF to code scanning and (with publish_results) posts to the OpenSSF API --
# outward writes, where a cancellation mid-publish is a partially-applied result rather than a
# discarded one. It is also schedule-driven, so overlap is rare and queueing costs nothing.
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20 # testing.md: every run has a finite clock; a room re-sizes this from its own measured suite time
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: results.sarif
