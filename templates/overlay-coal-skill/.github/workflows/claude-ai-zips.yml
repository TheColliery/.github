name: claude-ai-zips

# claude.ai installs skills as a ZIP only, and its skill-listing description cap is 200
# chars vs our own cross-platform 1024 (desc-cap.mjs). On a version tag: stage every
# skill with its description deterministically trimmed to the platform cap
# (scripts/build-claude-ai-zips.mjs — a DERIVED artifact, source skills/*/SKILL.md is
# never edited), zip each staged directory, and attach the ZIPs to the GitHub Release
# as assets. The user downloads a ZIP from the Release and uploads it to claude.ai
# directly. Canonical exemplar: CoalMine (board #40 / C2-v2 design).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {} # manual re-run against a tag ref whose push-triggered run already failed

# Minimal top-level token (Scorecard Token-Permissions best practice); only the
# build-zips job escalates to the write scope it needs to create the Release and
# upload assets — never grant contents:write at the top level for a single job's need.
permissions:
  contents: read

jobs:
  build-zips:
    runs-on: ubuntu-latest
    # A workflow_dispatch against the default branch has GITHUB_REF_NAME == the branch
    # name (e.g. "main") -- no hyphen -- so a shape-only pre-release check would read
    # "stable" and attempt a Release tagged with the branch name. Gate on ref_type first.
    if: github.ref_type == 'tag'
    permissions:
      contents: write # only this job creates the Release and uploads assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Tags = beta + stable (all); Releases = stable-only. This job creates a Release,
      # implicitly "Latest", for any tag push -- gate it so a pre-release tag never does.
      - name: Check the tag is STABLE, not a pre-release
        id: gate
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${GITHUB_REF_NAME} is a pre-release tag -- Releases are stable-only here, skipping claude.ai ZIP packaging"
          else
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify plugin/ dist is current (fail loud, never zip a stale dist)
        if: steps.gate.outputs.is_stable == 'true'
        run: node scripts/verify.mjs

      - name: Stage trimmed-description skill directories
        if: steps.gate.outputs.is_stable == 'true'
        run: node scripts/build-claude-ai-zips.mjs

      - name: Zip each staged skill directory
        if: steps.gate.outputs.is_stable == 'true'
        run: |
          set -euo pipefail
          cd dist-claude-ai
          for d in */; do
            name="${d%/}"
            (cd "$name" && zip -r "../${name}.zip" . -x '.*')
          done
          ls -la *.zip

      - name: Generate SHA256SUMS.txt for the ZIPs
        if: steps.gate.outputs.is_stable == 'true'
        run: |
          set -euo pipefail
          cd dist-claude-ai
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # This trigger fires on the tag push, possibly BEFORE a separate REST call creates
      # the Release -- a single idempotent `create`, swallowing the one expected
      # already-exists failure mode directly, is more reliable than a view-then-create probe.
      - name: Ensure the GitHub Release exists for this tag
        if: steps.gate.outputs.is_stable == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes || \
            gh release view "${GITHUB_REF_NAME}" >/dev/null || \
            { echo "::error::release create failed AND release view failed -- this is not the expected already-exists race" >&2; exit 1; }

      - name: Attach ZIPs + SHA256SUMS.txt to the GitHub Release for this tag
        if: steps.gate.outputs.is_stable == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist-claude-ai/*.zip dist-claude-ai/SHA256SUMS.txt --clobber
