name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # No npm install and no package.json: the checker has no dependencies. It may shell
      # out to `npx prettier@3`, which pulls prettier from the npm registry on first use,
      # so this job needs network. If prettier cannot run, the checker reports that as a
      # failure rather than as a pass.
      - run: node tools/check.mjs
