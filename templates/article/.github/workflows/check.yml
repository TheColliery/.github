name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# cancel-in-progress: TRUE -- the corpus checker reads and reports; it publishes nothing
# and touches no external state, so a superseded run has nothing to leave half-done
# (SKILL-REPO-PATTERN.md's concurrency MUST, cited not restated).
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # No npm install and no package.json: the checker has no dependencies. It may shell
      # out to `npx prettier@3`, which pulls prettier from the npm registry on first use,
      # so this job needs network. If prettier cannot run, the checker reports that as a
      # failure rather than as a pass.
      #
      # GATED ON tools/check.mjs EXISTING — this skeleton ships the workflow, never the
      # checker itself (genuinely bespoke per article repo, per this template's own
      # README). A bare "Use this template" click must not leave a permanently red
      # Actions tab with no fix available; hashFiles() returns '' when nothing matches,
      # so the step is cleanly SKIPPED (not silently passed) until the real script lands.
      - name: Run the corpus checker
        if: hashFiles('tools/check.mjs') != ''
        run: node tools/check.mjs
