# CodeRabbit configuration for the article repo kind (BB-82, owner 2026-10-08), DERIVED from the published-code canon, never retyped:
# the hooks and scripts/** blocks are dropped (an article repository ships no hooks and no scripts of its own beyond the parity-held scanner copies, which keep their block);
# the doc, workflow and scanner blocks and the knowledge_base block are the canon's, byte for byte (scripts/template-workflows.test.mjs holds that).
#
# CodeRabbit configuration for the published-code repo kind (AR-46, owner-signed 2026-09-21).
#
# It carries two things and only two:
#   1. reviews.profile: assertive -- a MEASURED TRIAL against the organization's Chill profile, to be
#      judged on the next snapshot round. It is not a verdict on the profile, and the organization-level
#      setting stays Chill until that measurement reads.
#   2. reviews.path_instructions that restate this org's written CONTRACTS. Each block names the
#      document it restates. There is no tone_instructions key and no taste in any block: an
#      instruction here may encode a contract, never a preference.
#   3. knowledge_base: the Learnings posture (BB-82, owner 2026-10-08). Learnings stay repository-local and wait the
#      maximum approval delay, so the owner approves or rejects each one in the dashboard before it applies. The
#      knowledge-base switch itself (data retention) is the organization's dashboard setting and the owner's click;
#      this file never flips it, so opt_out is not set here (a private repository sets opt_out: true in its own file).
#      THE OWNER'S LAW ON TEACHING, 2026-10-08, verbatim: ถ้าจะสอน CodeRabbit อย่าสอนให้เข้าพวก เพราะตัวตรวจจับ จะไม่เป็นตัวตรวจจับอีกต่อไป
#      -- an instruction or a learning encodes a fact or a contract (what a file is, where its fix lands, which
#      standard binds); it never tells the reviewer to stay quiet on a class, never grants an exception and never
#      carries our conclusion about a finding. A learning that would lower the number of findings is rejected at
#      the approval step. A detector taught to agree with its subject is no longer a detector.
#
# PRECEDENCE, from the vendor (docs.coderabbit.ai/guides/configuration-overview, "Understanding
# configuration priority"): "Configuration sources don't merge by default." The repository
# .coderabbit.yaml (priority 2) outranks Repository settings (4) and Organization settings (5), but NOT
# the Workspace and Organization global overrides (0 and 1), which "take precedence over all other
# configuration sources, including repository .coderabbit.yaml files" -- if the organization sets a
# profile as a global override, the assertive below is silently ignored. Inheritance is opt-in
# (docs.coderabbit.ai/configuration/configuration-inheritance: "Inheritance is disabled by default. You
# must explicitly enable it by adding inheritance: true to your configuration file"); without the line
# below this file would REPLACE the organization's other settings with schema defaults instead of adding
# to them. Read the merged result on any pull request with the comment: @coderabbitai configuration
inheritance: true
knowledge_base:
  learnings:
    scope: local
    approval_delay: 30
reviews:
  profile: assertive
  path_instructions:
    # Restates DOC-PATTERN.md: "Data is verbatim from its source, never invented" and "a behaviour claim = the code".
    - path: "{README,SECURITY,CONTRIBUTING}.md"
      instructions: |
        A claim about behavior must match what the code actually does, and any data shown (a version, a model ID, a benchmark figure, a count) must match its authoritative source verbatim: a version is the one in plugin.json, a benchmark figure links to its record instead of being copied, a behavior claim is whatever the code does. Report a claim the code contradicts or a figure that differs from its source.
    # Restates SKILL-REPO-PATTERN.md: the SHA-pinned workflow set, the concurrency: groups rule, and the persist-credentials sentence added beside them.
    - path: ".github/workflows/**"
      instructions: |
        Report a change that breaks any of these:
        - Every third-party action is pinned to a full 40-character commit SHA with a version comment, never a bare tag or branch.
        - Every workflow has a concurrency group. cancel-in-progress is true for CI, lint and CodeQL, and never true for a job that uploads a Release or tag asset.
        - A checkout that pushes nothing sets persist-credentials: false.
    # Restates the scanner canon's parity contract (the umbrella's scripts/scanner-parity.mjs): these four files are byte-equal copies of one source room's scanner and gate, and a copy is never edited locally.
    - path: "scripts/{lib/secret-scan.mjs,secret-scan.test.mjs,secret-gate.mjs,secret-gate.test.mjs}"
      instructions: |
        These files are byte-equal copies of the organization's scanner canon, held equal to their source by a parity check; a local edit breaks the parity on purpose. Review them on their merits exactly as any other file and report every finding at its severity. Add to each finding that the fix is made at the canon's source and arrives here by blob id at the next sync, so the author routes it there instead of editing this copy. Never lower a severity, drop a finding or accept a local patch because the file is a copy.
