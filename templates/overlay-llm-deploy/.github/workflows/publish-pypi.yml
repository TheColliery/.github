name: Publish to PyPI

# Manual or tag-driven only. Never on every push — PyPI refuses a version that already
# exists, so a push trigger would turn every commit into a red run.
#
# Sourced verbatim (mechanism) from Kolwen's live .github/workflows/publish-pypi.yml
# (LLMWorks/Kolwen, read 2026-09-03, UMB-045 letter (D)). {{PY_DIR}} and the tag prefix
# are the only per-tool variables — everything else, including the fail-safe TestPyPI
# default, is load-bearing and should not be loosened.
on:
  workflow_dispatch:
  push:
    tags: ["{{TAG_PREFIX}}-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing — no API token stored anywhere
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build
        working-directory: {{PY_DIR}}
        run: |
          python -m pip install --require-hashes -r requirements-build.txt
          python -m build

      # WHERE THIS PUBLISHES, decided fail-safe: ONLY a clean release tag ({{TAG_PREFIX}}-vX.Y.Z,
      # digits only) reaches real PyPI. Everything else — a PEP 440 pre-release or .devN, a tag
      # with a word in it, and every workflow_dispatch, where ref_name is a BRANCH and not a
      # version at all — goes to TestPyPI.
      #
      # The direction matters more than the cleverness: a wrong TestPyPI upload is harmless, a
      # wrong PyPI upload is PERMANENT and can never be re-uploaded or reclaimed. Kolwen's own
      # first cut of this tested the whole ref for the letters a/b/rc, which sent a .dev1 tag
      # to real PyPI and every dispatch from `main` (it contains an 'a') to TestPyPI — wrong in
      # both directions. Do not reintroduce that shape.
      - name: Decide publish target
        id: target
        env:
          # Never interpolate a ref into a shell string: that is the script-injection shape the
          # flock's dangerous-workflow rule bans. Through the environment it is data, not code.
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ] && printf '%s' "$REF_NAME" | grep -Eq '^{{TAG_PREFIX}}-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo 'url=' >> "$GITHUB_OUTPUT"
            echo "release tag $REF_NAME -> real PyPI"
          else
            echo 'url=https://test.pypi.org/legacy/' >> "$GITHUB_OUTPUT"
            echo "$REF_TYPE $REF_NAME is not a clean release tag -> TestPyPI"
          fi

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: {{PY_DIR}}/dist
          repository-url: ${{ steps.target.outputs.url }}
